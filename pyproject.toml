[project]
name = "ai-agent-orchestration-system"
version = "1.0.0"
description = "Offline-first Customer Operations AI Agent"
requires-python = ">=3.11"
dependencies = [
  "streamlit==1.59.2",
  "langgraph==1.2.9",
  "pydantic==2.13.4",
  "python-dotenv==1.1.1",
  "openai==2.46.0",
  "anthropic==0.117.0",
  "google-genai==2.13.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.pytest_tmp"
